<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Maatora: active-transit cold-chain temperature monitoring with client assurance, fleet telematics and printable compliance certificates.">
  <meta name="theme-color" content="#FFFFFF">
  <title>Maatora | Cold-Chain Monitoring</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230284C7'/%3E%3Cpath d='M16 7v18M8.2 11.5l15.6 9M23.8 11.5l-15.6 9' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Icon sprite: referenced through <use href="#i-..."> -->
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-shield-check" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.700-7-5.500-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7.500a3.500 3.500 0 0 0 0-7h-7a3.500 3.500 0 0 1 0-7H16"/></symbol>
    <symbol id="i-document" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
    <symbol id="i-fleet" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.500"/><rect x="14" y="3" width="7" height="7" rx="1.500"/><rect x="3" y="14" width="7" height="7" rx="1.500"/><rect x="14" y="14" width="7" height="7" rx="1.500"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-thermo" viewBox="0 0 24 24"><path d="M14 14.800V5a2 2 0 1 0-4 0v9.800a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24"><rect x="3" y="8" width="16" height="8" rx="2"/><path d="M21 11v2M6.500 11v2M9.500 11v2M12.500 11v2"/></symbol>
    <symbol id="i-signal" viewBox="0 0 24 24"><path d="M5 19v-3M10 19v-7M15 19V8M20 19V4"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5.500"/><circle cx="12" cy="17" r="1.200"/></symbol>
    <symbol id="i-tank" viewBox="0 0 24 24"><path d="M12 3s6 6.200 6 11a6 6 0 0 1-12 0c0-4.800 6-11 6-11z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 15.500H3L12 4z"/><path d="M12 10v4.500M12 17.200v.300"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.500 6.500l4 4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.500-4M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.500 4M20 20v-4h-4"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.500"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.500"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </svg>

  <div class="stage">
    <div class="device">
      <div class="app" id="app" data-role="client" data-alert="false">

        <header class="topbar">
          <div class="topbar__row">
            <div class="brand">
              <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                <rect class="brand__mark-bg" width="32" height="32" rx="9"/>
                <path class="brand__mark-fg" d="M16 7v18M8.200 11.500l15.600 9M23.800 11.500l-15.600 9"/>
              </svg>
              <div class="brand__text">
                <span class="brand__name">Maatora</span>
                <span class="brand__tag">Cold-Chain Monitoring</span>
              </div>
            </div>
            <div class="live-chip" id="live-chip">
              <span class="pulse-dot" aria-hidden="true"></span>
              <span id="live-chip-text">Live</span>
            </div>
          </div>

          <div class="role-switch" id="role-switch" role="group" aria-label="Operational role" data-role="client">
            <span class="role-switch__thumb" aria-hidden="true"></span>
            <button type="button" class="role-switch__option" data-role-target="client" aria-pressed="true">Client View</button>
            <button type="button" class="role-switch__option" data-role-target="admin" aria-pressed="false">Admin &amp; Telematics</button>
          </div>

          <div class="account-bar" id="account-bar" hidden>
            <p class="account-bar__who">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-user"></use></svg>
              <span id="account-name"></span>
            </p>
            <button type="button" class="link-btn" data-action="sign-out">Sign Out</button>
          </div>
        </header>

        <main class="viewport" id="viewport" tabindex="-1">

          <div class="alert-bar" id="admin-alert" role="alert" hidden>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-alert"></use></svg>
            <div>
              <p class="alert-bar__title" id="admin-alert-title">Active Excursion</p>
              <p class="alert-bar__note" id="admin-alert-note"></p>
            </div>
          </div>

          <!-- ================= CLIENT: OVERVIEW ================= -->
          <section class="panel" data-role="client" data-panel="overview" aria-label="Shipment overview">

            <div class="unit-picker unit-picker--consignments" data-consignment-picker role="group" aria-label="Select consignment" hidden></div>

            <div class="banner banner--safe" id="client-banner">
              <span class="pulse-dot" aria-hidden="true"></span>
              <div class="banner__body">
                <p class="banner__title" id="client-banner-title">REFRIGERATION GUARANTEED &bull; SAFE SPEC</p>
                <p class="banner__note" id="client-banner-note"></p>
              </div>
            </div>

            <article class="card cargo" id="cargo-card" aria-labelledby="cargo-consignment">
              <header class="card__head">
                <div>
                  <p class="eyebrow">Consignment ID</p>
                  <h1 class="mono-id" id="cargo-consignment">BATCH-REF-8841-X</h1>
                </div>
                <span class="chip chip--safe" id="cargo-state">Within Spec</span>
              </header>

              <p class="cargo__type" id="cargo-type"></p>

              <div class="cargo__reading">
                <p class="eyebrow">Current Temperature</p>
                <p class="temp-display" id="cargo-temp" aria-live="polite"></p>
                <p class="cargo__target" id="cargo-target"></p>
              </div>

              <div class="range-meter" id="cargo-meter" role="img" aria-label="Temperature against permitted range">
                <div class="range-meter__track">
                  <span class="range-meter__band"></span>
                  <span class="range-meter__setpoint"></span>
                  <span class="range-meter__marker"></span>
                </div>
                <div class="range-meter__scale" aria-hidden="true">
                  <span class="range-meter__tick range-meter__tick--min" id="meter-min"></span>
                  <span class="range-meter__tick range-meter__tick--max" id="meter-max"></span>
                </div>
              </div>

              <p class="cargo__route">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-route"></use></svg>
                <span id="cargo-corridor"></span>
              </p>
            </article>

            <article class="card" aria-labelledby="route-heading">
              <header class="card__head">
                <h2 class="card__title" id="route-heading">Route &amp; Corridor Status</h2>
                <span class="chip chip--ice" id="route-chip">In Transit</span>
              </header>
              <ol class="stepper" id="route-stepper"></ol>
            </article>

            <button type="button" class="btn btn--primary btn--block" data-action="open-certificate">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-shield-check"></use></svg>
              <span>View Official Compliance Certificate</span>
            </button>
          </section>

        </main>

        <nav class="glass-dock" id="dock" aria-label="Section navigation">
          <span class="glass-dock__pill" aria-hidden="true"></span>
          <div class="glass-dock__items" id="dock-items"></div>
        </nav>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

</body>
</html>
