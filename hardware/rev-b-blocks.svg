<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <title id="title">Maatora tracker board, Rev B block diagram</title>
  <desc id="desc">Vehicle power passes through input protection and a 5 volt converter to a battery charger. The battery forms a system rail that feeds the modem and the 3.3 volt regulator for the ESP32-S3. The processor connects to GPS, RS-485 sensors, a one-wire probe, two door inputs, the LTE modem, a motion sensor, USB-C, status lights and voltage sensing.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1040" height="640" fill="#FFFFFF"/>

  <!-- Connections -->
  <g fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M170 62H198"/>
    <path d="M390 62H418"/>
    <path d="M590 62H618"/>
    <path d="M705 94V128"/>
    <path d="M618 155H592"/>
    <path d="M505 180V238"/>
    <path d="M790 155H890V238"/>
    <path d="M300 265H378"/>
    <path d="M300 315H378"/>
    <path d="M300 370H378"/>
    <path d="M300 420H378"/>
    <path d="M530 490V442"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M792 62H818"/>
    <path d="M682 265H758"/>
    <path d="M682 320H758"/>
    <path d="M682 370H758"/>
  </g>
  <path d="M682 420H758" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Power chain -->
  <g font-size="13" text-anchor="middle" fill="#0F172A">
    <rect x="20" y="30" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="95" y="58" font-weight="600">Vehicle supply</text>
    <text x="95" y="76" font-size="11.5" fill="#475569">12 V or 24 V</text>

    <rect x="200" y="30" width="190" height="64" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <text x="295" y="54" font-weight="600">Input protection</text>
    <text x="295" y="71" font-size="11.5" fill="#475569">fuse, spike suppressor,</text>
    <text x="295" y="85" font-size="11.5" fill="#475569">reverse polarity, 60 V parts</text>

    <rect x="420" y="30" width="170" height="64" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <text x="505" y="58" font-weight="600">5 V converter</text>
    <text x="505" y="76" font-size="11.5" fill="#475569">rated for 60 V input</text>

    <rect x="620" y="30" width="170" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="705" y="54" font-weight="600">Battery charger</text>
    <text x="705" y="71" font-size="11.5" fill="#475569">stops when the cell is</text>
    <text x="705" y="85" font-size="11.5" fill="#475569">too cold or too hot</text>

    <rect x="820" y="30" width="200" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="920" y="58" font-weight="600">Backup battery</text>
    <text x="920" y="76" font-size="11.5" fill="#475569">one lithium cell, in the cab</text>

    <rect x="620" y="130" width="170" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="705" y="152" font-weight="600">System rail</text>
    <text x="705" y="169" font-size="11.5" fill="#475569">3.4 to 4.2 V</text>

    <rect x="420" y="130" width="170" height="50" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <text x="505" y="152" font-weight="600">3.3 V regulator</text>
    <text x="505" y="169" font-size="11.5" fill="#475569">now fed from the system rail</text>

    <!-- Processor -->
    <rect x="380" y="240" width="300" height="200" rx="14" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8"/>
    <text x="530" y="332" font-size="17" font-weight="700">ESP32-S3</text>
    <text x="530" y="354" font-size="12" fill="#475569">processor, Wi-Fi, flash buffer</text>

    <!-- Left: inputs -->
    <rect x="20" y="245" width="280" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="160" y="270" font-weight="600">GPS module and antenna</text>

    <rect x="20" y="292" width="280" height="46" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <text x="160" y="312" font-weight="600">RS-485 to cargo sensors</text>
    <text x="160" y="329" font-size="11.5" fill="#475569">surge protected, fused supply</text>

    <rect x="20" y="350" width="280" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="160" y="375" font-weight="600">One-wire temperature probe</text>

    <rect x="20" y="400" width="280" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="160" y="425" font-weight="600">Two door switch inputs</text>

    <!-- Right: outputs -->
    <rect x="760" y="240" width="260" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="890" y="261" font-weight="600">LTE modem</text>
    <text x="890" y="278" font-size="11.5" fill="#475569">SIM holder, antenna, level shifting</text>

    <rect x="760" y="300" width="260" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="890" y="325" font-weight="600">Motion and board climate sensors</text>

    <rect x="760" y="350" width="260" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="890" y="375" font-weight="600">USB-C: programming and logs</text>

    <rect x="760" y="400" width="260" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="890" y="425" font-weight="600">Power, network and status lights</text>

    <!-- Bottom: sensing -->
    <rect x="380" y="490" width="300" height="50" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <text x="530" y="512" font-weight="600">Voltage sensing</text>
    <text x="530" y="529" font-size="11.5" fill="#475569">ignition, main supply, battery</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#0F172A">
    <rect x="20" y="584" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="46" y="598">Kept from Rev A</text>
    <rect x="190" y="584" width="18" height="18" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <text x="216" y="598">Changed in Rev B</text>
    <rect x="370" y="584" width="18" height="18" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <text x="396" y="598">New in Rev B</text>
    <text x="1020" y="598" text-anchor="end" fill="#64748B">Design proposal: review by an electronics engineer before ordering</text>
  </g>
</svg>
